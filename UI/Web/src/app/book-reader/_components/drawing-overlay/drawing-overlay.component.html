<div class="drawing-wrapper" [class.draw-active]="drawMode">

  <!-- Canvas layer -->
  <canvas #canvas class="drawing-canvas" [class.pointer-through]="!drawMode"></canvas>

  <!-- Toolbar — only when draw mode is on -->
  @if (drawMode) {
    <div class="draw-toolbar" (click)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()">

      <!-- Tools -->
      <button class="tool-btn" [class.active]="tool === 'pen'" (click)="setTool('pen')" title="Pen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/>
        </svg>
      </button>

      <button class="tool-btn" [class.active]="tool === 'highlighter'" (click)="setTool('highlighter')" title="Highlighter">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" opacity="0.6">
          <rect x="3" y="10" width="18" height="6" rx="2"/>
        </svg>
      </button>

      <button class="tool-btn" [class.active]="tool === 'eraser'" (click)="setTool('eraser')" title="Eraser">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 20H7L3 16l11-11 7 7-3 3"/><path d="M6 17l2-2"/>
        </svg>
      </button>

      <div class="divider"></div>

      <!-- Size slider -->
      <div class="size-control">
        <div class="size-preview" [style.width.px]="toolSize" [style.height.px]="toolSize"
             [style.background]="tool === 'eraser' ? 'rgba(255,255,255,0.5)' : color"
             [style.opacity]="tool === 'highlighter' ? 0.35 : 1"></div>
        <input type="range" class="size-slider" [min]="1" [max]="40"
               [(ngModel)]="toolSize" (input)="onSizeChange()" title="Size" />
      </div>

      <div class="divider"></div>

      <!-- Color swatches -->
      @for (c of colors; track c) {
        <button class="color-swatch" [style.background]="c" [class.selected]="color === c"
                (click)="color = c" [title]="c"></button>
      }

      <div class="divider"></div>

      <!-- Undo / Clear -->
      <button class="tool-btn" (click)="undo()" [disabled]="!hasStrokes" title="Undo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 00-4-4H4"/>
        </svg>
      </button>

      <button class="tool-btn danger" (click)="clear()" [disabled]="!hasStrokes" title="Clear all">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6m5 0V4h4v2"/>
        </svg>
      </button>

    </div>
  }

</div>
